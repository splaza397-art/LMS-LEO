<Directory /var/www/html/public>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    FallbackResource /r.php
</Directory>

# Fase 4.11: sso.php recibe en la URL valores de un solo uso (state, comprobante). Aunque ya no sirven después de
# usarse, no se escriben en el registro de accesos: para esa ruta se registra solo el camino, sin la consulta ni el
# Referer. El resto de Moodle se registra igual que antes (formato combined).
SetEnvIf Request_URI "^/local/iinicia/sso\.php$" iinicia_sso
LogFormat "%h %l %u %t \"%m %U?[consulta omitida] %H\" %>s %O \"-\" \"%{User-Agent}i\"" iinicia_sso
